# Project development tooling; loaded by Codex only after this project is trusted.
# https://developers.openai.com/codex/mcp
[mcp_servers.ruflo]
command = "npx"
args = ["--yes", "ruflo@3.80.9", "mcp", "start", "--transport", "stdio"]
startup_timeout_sec = 120
enabled_tools = [
  "system_info", "memory_store", "memory_retrieve", "memory_search",
  "memory_list", "memory_delete", "task_create", "task_list",
  "task_status", "task_update", "task_complete", "swarm_status"
]

# ONNX bundles CPU binaries; avoid downloading extra CUDA/TensorRT libraries.
[mcp_servers.ruflo.env]
ONNXRUNTIME_NODE_INSTALL = "skip"
npm_config_cache = ".claude-flow/npm-cache"
